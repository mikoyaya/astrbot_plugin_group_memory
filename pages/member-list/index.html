<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>群成员数据</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">QQ GROUP MEMORY</p>
          <h1>群成员数据</h1>
          <p class="subtitle">仅展示已记录过群消息的成员基础资料。</p>
        </div>
        <button id="refresh-button" class="icon-button" type="button" title="刷新数据" aria-label="刷新数据">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <section class="toolbar" aria-label="成员数据筛选">
        <label class="search-field">
          <span>筛选成员</span>
          <input id="search-input" type="search" placeholder="昵称、QQ号、群号、标签或备注" />
        </label>
        <p id="summary" class="summary" aria-live="polite">正在加载成员数据…</p>
      </section>

      <section class="table-region" aria-label="成员列表">
        <div id="empty-state" class="empty-state" hidden>
          <strong>暂无已记录成员</strong>
          <p>机器人收到 QQ 群消息后，成员会自动出现在这里。</p>
        </div>
        <div class="table-scroll">
          <table id="member-table" hidden>
            <thead>
              <tr>
                <th>群</th>
                <th>成员</th>
                <th>消息数</th>
                <th>最近消息</th>
                <th>标签</th>
                <th>备注</th>
              </tr>
            </thead>
            <tbody id="member-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="member-dialog" class="member-dialog" aria-labelledby="detail-title">
      <section class="dialog-shell">
        <header class="dialog-header">
          <div>
            <p class="eyebrow">MEMBER PROFILE</p>
            <h2 id="detail-title">成员详情</h2>
          </div>
          <button id="dialog-close" class="icon-button" type="button" title="关闭" aria-label="关闭">×</button>
        </header>

        <p id="detail-status" class="dialog-status" aria-live="polite"></p>
        <dl class="detail-grid">
          <div><dt>QQ号</dt><dd id="detail-user-id">-</dd></div>
          <div><dt>昵称</dt><dd id="detail-nickname">-</dd></div>
          <div><dt>所属群</dt><dd id="detail-group">-</dd></div>
          <div><dt>消息数</dt><dd id="detail-message-count">-</dd></div>
          <div><dt>最近消息</dt><dd id="detail-last-message">-</dd></div>
          <div><dt>基础画像</dt><dd id="detail-profile">暂无</dd></div>
        </dl>

        <section class="editor-section" aria-labelledby="note-heading">
          <div class="section-heading">
            <h3 id="note-heading">备注</h3>
            <button id="save-note-button" class="command-button" type="button">保存备注</button>
          </div>
          <textarea id="note-input" rows="3" placeholder="输入当前群内备注"></textarea>
        </section>

        <section class="editor-section" aria-labelledby="tag-heading">
          <div class="section-heading">
            <h3 id="tag-heading">标签</h3>
          </div>
          <div id="detail-tag-list" class="tag-list" aria-label="成员标签"></div>
          <div class="tag-editor">
            <input id="tag-input" type="text" maxlength="64" placeholder="输入新标签" />
            <button id="add-tag-button" class="command-button" type="button">添加标签</button>
          </div>
        </section>
      </section>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
